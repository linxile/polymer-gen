# Tomcat配置项
server:
  port: 8082
  servlet:
    context-path: /polymer-gen

# spring配置项
spring:
  application:
    name: polymer-gen
  datasource:
    # MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/polymer-gen?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    # Oracle
    #    driver-class-name: oracle.jdbc.OracleDriver
    #    url: jdbc:oracle:thin:@localhost:1521:xe
    #    username: maku_generator
    #    password: maku_generator
    # SQLServer
    #    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    #    url: jdbc:sqlserver://localhost:1433;DatabaseName=maku_generator;encrypt=true;trustServerCertificate=true
    #    username: sa
    #    password: 123456@maku
    # postgresql
    #    driver-class-name: org.postgresql.Driver
    #    url: jdbc:postgresql://localhost:5432/postgres
    #    username: postgres
    #    password: 123456
    # 达梦8
