    #    url: jdbc:dm://localhost:5236/maku_generator?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    #    username: maku_generator
    #    password: 12345678

# MyBatis
mybatis:
  # 搜索指定包别名
  type-aliases-package: com.polymer.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    #使全局的映射器启用或禁用缓存
    cache-enabled: true
    #允许JDBC 支持自动生成主键
    use-generated-keys: true
    #配置默认的执行器.SIMPLE就是普通执行器;REUSE执行器会重用预处理语句(prepared statements);BATCH执行器将重用语句并执行批量更新
    default-executor-type: SIMPLE
    #开启驼峰映射
    map-underscore-to-camel-case: true

# PageHelper分页插件
pagehelper:
  #指定数据库方言，例如mysql
  helper-dialect: mysql
  #是否支持通过Mapper接口方法的参数来传递分页参数
  support-methods-arguments: true
  #设置为count=countSql可以防止SQL注入
  params: count=countSql
  #允许pageSize为0，即查询出全部结果
  page-size-zero: true
